# Nginx 反代方式（可选）：server.py 已监听 4000，用 Nginx 在 443/域名下反代
# 存为 /etc/nginx/conf.d/od-toolkit.conf 后 nginx -s reload
# 注意 /api/ 路径必须一并转发（风格数据同步接口）
server {
    listen 80;
    server_name od.example.com;   # 改成你的域名

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 96m;   # 风格样本含图片，放大请求体限制
    }
}
